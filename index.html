<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Classic Pac-Man arcade game" />
    <title>Pac-Man</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      #game-container {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #game-canvas {
        display: block;
        image-rendering: pixelated;
      }
      #ui-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      #ui-overlay > * {
        pointer-events: auto;
      }
      :focus-visible {
        outline: 2px solid #FFD700;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <div id="game-container">
      <canvas id="game-canvas" aria-label="Pac-Man game board"></canvas>
      <div id="ui-overlay" role="region" aria-label="Game UI"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
